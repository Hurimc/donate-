<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DONATE - Agribank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .agri-gradient { background: linear-gradient(135deg, #054a29 0%, #002b15 100%); }
        .card-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 antialiased">

    <header class="w-full max-w-lg flex items-center justify-between py-4 mb-2">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl agri-gradient flex items-center justify-center shadow-lg border border-emerald-500/30">
                <i class="fa-solid font-bold text-emerald-400 text-xl">D</i>
            </div>
            <div>
                <h1 class="font-extrabold text-xl tracking-wider text-white">DONATE</h1>
                <p class="text-xs text-slate-400 font-medium">Hỗ trợ Agribank & Tất cả ngân hàng</p>
            </div>
        </div>
    </header>

    <main class="w-full max-w-lg card-glass rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
                    <div class="w-3 h-3 bg-emerald-500 rounded-full absolute top-0 left-0 animate-ping opacity-75"></div>
                </div>
                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Cổng nhận Agribank</span>
            </div>
        </div>

        <div class="space-y-5">
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Tên của bạn</label>
                    <button onclick="randomizeName()" class="text-[11px] text-emerald-400 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-shuffle"></i> Tên ngẫu nhiên
                    </button>
                </div>
                <input type="text" id="donorName" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="Nhập tên hiển thị...">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Chọn nhanh số tiền</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setAmount(10000)" class="py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-xs font-bold text-slate-300 transition">10K</button>
                    <button onclick="setAmount(20000)" class="py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-xs font-bold text-emerald-400 transition">20K</button>
                    <button onclick="setAmount(50000)" class="py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-xs font-bold text-slate-300 transition">50K</button>
                    <button onclick="setAmount(100000)" class="py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-xs font-bold text-amber-400 transition">100K</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Số tiền ủng hộ (VNĐ)</label>
                <div class="relative">
                    <input type="number" id="amount" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-4 pr-12 py-3 text-slate-100 font-bold text-lg focus:outline-none focus:border-emerald-500 transition" placeholder="20000" value="20000">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xs">VNĐ</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Lời nhắn gửi kèm</label>
                <textarea id="message" rows="2" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition resize-none" placeholder="Lời nhắn hoặc lời chúc..."></textarea>
            </div>

            <button onclick="generateQR()" class="w-full agri-gradient hover:opacity-90 text-white font-bold py-3.5 rounded-xl shadow-lg border border-emerald-500/40 transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                <i class="fa-solid fa-qrcode text-base"></i>
                <span>Tạo Mã QR Chuyển Tiền</span>
            </button>
        </div>

        <div id="qrContainer" class="hidden mt-8 pt-6 border-t border-slate-800 text-center space-y-4">
            <div class="inline-block p-3 bg-white rounded-2xl shadow-xl">
                <img id="qrImage" src="" alt="Mã QR VietQR Agribank" class="w-56 h-56 mx-auto rounded-lg">
            </div>

            <div class="space-y-1">
                <p class="text-sm font-semibold text-slate-200">Agribank - 7700205292060</p>
                <p class="text-xs text-emerald-400 font-bold uppercase">CHỦ TÀI KHOẢN: LUONG THANH HA</p>
                <p class="text-xs text-slate-400 mt-2">Mở ứng dụng Ngân hàng quét mã để tự động điền số tiền & nội dung.</p>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-center text-xs text-slate-500">
        <p>© 2026 DONATE System. Tương thích VietQR & Napas247.</p>
    </footer>

    <script>
        const randomNames = ["Sơn Tùng", "Minh Tuấn", "Gamer 99", "Ẩn danh", "Thành Trung", "Phương Thảo", "Bảo Long", "Huri Fan"];

        function randomizeName() {
            document.getElementById('donorName').value = randomNames[Math.floor(Math.random() * randomNames.length)];
        }

        function setAmount(val) {
            document.getElementById('amount').value = val;
        }

        function generateQR() {
            const name = document.getElementById('donorName').value.trim() || 'An danh';
            const amount = document.getElementById('amount').value;

            if (!amount || amount < 1000) {
                alert('Vui lòng nhập số tiền từ 1,000 VNĐ trở lên!');
                return;
            }

            const memo = `DONATE ${name}`.substring(0, 25);
            const qrUrl = `https://img.vietqr.io/image/AGRIBANK-7700205292060-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(memo)}&accountName=LUONG%20THANH%20HA`;

            const qrImg = document.getElementById('qrImage');
            qrImg.src = qrUrl;

            const container = document.getElementById('qrContainer');
            container.classList.remove('hidden');

            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        }

        randomizeName();
    </script>
</body>
</html>
